<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f4fd" />
    <meta name="description" content="우리끼리 내기 게임." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="하면해" />
    <meta property="og:title" content="하면해 — 우리끼리 내기 게임" />
    <meta property="og:description" content="우리끼리 내기 게임." />
    <meta property="og:url" content="https://betya.toxcap.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="하면해 — 우리끼리 내기 게임" />
    <meta name="twitter:description" content="우리끼리 내기 게임." />
    <title>하면해 — 우리끼리 내기 게임</title>
    <link rel="stylesheet" href="./styles.css?v=20261025-memoment-1" />
    <link rel="stylesheet" href="./room.css?v=20261022-chat-colors-3" />
    <link rel="stylesheet" href="./home.css?v=20261025-memoment-1" />
    <link rel="stylesheet" href="./modal.css?v=20261026-mobile-fit-2" />
    <link rel="stylesheet" href="./game-screen.css?v=20261101-chat-align" />
    <link rel="preload" href="./assets/fonts/KERISKEDU-B.woff" as="font" type="font/woff" crossorigin />
    <link rel="prefetch" href="./dice.html" as="document" />
    <link rel="prefetch" href="./dice.css?v=20261025-memoment-1" as="style" />
    <link rel="prefetch" href="./dice.js?v=20261027-guest-cta-1" as="script" />
    <link rel="stylesheet" href="./theme.css?v=20261101-room-tools" />
    <link rel="stylesheet" href="./nunchi.css?v=20261102-nunchi-1" />
    <link rel="stylesheet" href="./bomb.css?v=20261102-bomb-circle-2" />
    <link rel="stylesheet" href="./rps.css?v=20261101-result-view" />
  </head>
  <body>
    <div class="home-pattern" aria-hidden="true"></div>
    <header class="site-header">
      <button class="brand" type="button" aria-label="게임 선택 화면으로 이동">
        <span class="brand-art"><img src="./assets/home/catalog-logo.svg" alt="하면해" /></span>
      </button>
    </header>

    <main id="app" aria-live="polite"></main>

    <template id="home-template">
      <section class="home" aria-labelledby="home-title">
        <h1 id="home-title" class="sr-only">게임을 골라주세요</h1>
        <div class="home-actions">
          <button class="home-join-button" type="button"><span class="sr-only">방 입장하기</span><img src="./assets/home/join-button-complete.svg" alt="" aria-hidden="true" /></button>
        </div>
        <div class="game-grid">
          <button class="game-card game-card--dice" type="button" data-route="dice">
            <span class="card-outline" aria-hidden="true"><img src="./assets/home/card-outline.svg" alt="" /></span>
            <span class="card-copy">
              <strong>0의 주사위</strong>
              <span>값이 가장 낮은 사람이 쏘기~!</span>
            </span>
            <span class="card-art card-art--dice" aria-hidden="true">
              <span class="art-canvas"><img src="./assets/home/catalog-dice.svg" alt="" /></span>
            </span>
          </button>

          <button class="game-card game-card--pick" type="button" data-route="pick">
            <span class="card-outline" aria-hidden="true"><img src="./assets/home/card-outline.svg" alt="" /></span>
            <span class="card-copy">
              <strong>아무나 걸려라</strong>
              <span>그냥 아묻따 랜덤 뽑기 ㄷㄷ</span>
            </span>
            <span class="card-art card-art--pick" aria-hidden="true">
              <span class="art-canvas"><img src="./assets/home/catalog-pick.svg" alt="" /></span>
            </span>
          </button>

          <button class="game-card game-card--team" type="button" data-route="team">
            <span class="card-outline" aria-hidden="true"><img src="./assets/home/card-outline.svg" alt="" /></span>
            <span class="card-copy">
              <strong>팀 나누기</strong>
              <span>아 팀전으로 가면 가~</span>
            </span>
            <span class="card-art card-art--team" aria-hidden="true">
              <span class="art-canvas"><img class="team-left" src="./assets/home/catalog-team-left.svg" alt="" /><img class="team-right" src="./assets/home/catalog-team-right.svg" alt="" /></span>
            </span>
          </button>
          <button class="game-card game-card--roulette" type="button" data-route="roulette">
            <span class="card-copy"><strong>돌려돌려</strong><span>돌려돌려~ 누구 차례일까?</span></span>
            <span class="card-art card-art--roulette" aria-hidden="true"><span class="art-canvas"><img src="./assets/home/catalog-roulette.svg" alt="" /></span></span>
          </button>
          <button class="game-card game-card--rps" type="button" data-route="rps">
            <span class="card-copy"><strong>가위바위보</strong><span>아 안 내면 진거~</span></span>
            <span class="card-art card-art--rps" aria-hidden="true"><span class="art-canvas"><img src="./assets/rps/catalog.svg" alt="" /></span></span>
          </button>
          <button class="game-card game-card--bomb" type="button" data-route="bomb">
            <span class="card-copy"><strong>폭탄 돌리기</strong><span>나한테서 터지면 안 돼!</span></span>
            <span class="card-art card-art--bomb" aria-hidden="true"><span class="art-canvas"><img src="./assets/home/catalog-bomb.svg" alt="" /></span></span>
          </button>
          <button class="game-card game-card--nunchi" type="button" data-route="nunchi">
            <span class="card-copy"><strong>눈치게임</strong><span>겹치면 걸린다! 눈치껏 눌러~</span></span>
            <span class="card-art card-art--nunchi" aria-hidden="true"><span class="art-canvas"><img src="./assets/home/catalog-nunchi.svg" alt="" /></span></span>
          </button>
        </div>
      </section>
    </template>

    <script src="./room.js?v=20261102-tap-clash-1"></script>
    <script src="./roulette.js?v=20261101-room-tools"></script>
    <script src="./rps.js?v=20261101-result-view"></script>
    <script src="./bomb.js?v=20261102-bomb-circle-2"></script>
    <script src="./nunchi.js?v=20261102-nunchi-1"></script>
    <script src="./app.js?v=20261102-tap-clash-1"></script>
    <script src="./game-outline.js?v=20261101-room-tools"></script>
  </body>
</html>
