<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7ff" />
    <meta name="description" content="하면해의 0의 주사위 게임." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="하면해" />
    <meta property="og:title" content="0의 주사위 — 하면해" />
    <meta property="og:description" content="두 번 굴려 더한 값이 가장 낮은 사람이 쏘기~!" />
    <meta property="og:url" content="https://hamyeonchae-games.pages.dev/dice" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="0의 주사위 — 하면해" />
    <meta name="twitter:description" content="두 번 굴려 더한 값이 가장 낮은 사람이 쏘기~!" />
    <title>0의 주사위 — 하면해</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23ff4d67'/%3E%3Ccircle cx='20' cy='20' r='5' fill='white'/%3E%3Ccircle cx='44' cy='20' r='5' fill='white'/%3E%3Ccircle cx='32' cy='32' r='5' fill='white'/%3E%3Ccircle cx='20' cy='44' r='5' fill='white'/%3E%3Ccircle cx='44' cy='44' r='5' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./dice.css?v=20261012-1" />
    <link rel="stylesheet" href="./room.css?v=20261012-1" />
  </head>
  <body>
    <button class="home-link" id="dice-home" type="button" aria-label="게임 선택 화면으로 돌아가기">
      <span aria-hidden="true">←</span>
    </button>
    <main class="game-shell" aria-labelledby="game-title">
      <header class="game-header">
        <h1 id="game-title">0의 주사위</h1>
        <p class="rule">두 번 굴려 더한 값이 가장 낮은 사람이 쏘기~!</p>
      </header>

      <div class="dice-workspace">
        <section class="dice-panel settings-panel" aria-labelledby="settings-title">
          <h2 id="settings-title">게임 설정</h2>
          <p class="panel-helper">인원수를 정하고 참가자 이름을 입력해주세요.</p>
          <div class="setup" aria-label="참가 인원 설정">
            <span class="setup-label">참가 인원</span>
            <div class="stepper">
              <button id="decrease-players" type="button" aria-label="인원 줄이기">−</button>
              <strong id="player-count" aria-live="polite">6명</strong>
              <button id="increase-players" type="button" aria-label="인원 늘리기">＋</button>
            </div>
          </div>
          <p class="name-helper">이름을 누르면 바로 수정할 수 있어요.</p>
          <ol class="players" id="players" aria-label="참가자 진행 상황"></ol>
        </section>

        <section class="dice-panel play-area" aria-live="polite">
          <div class="play-heading">
            <h2>주사위 굴리기</h2>
            <p class="turn-label" id="turn-label">1번 차례</p>
          </div>
          <div class="dice-stage" aria-label="주사위 결과">
            <span class="dice-floor-shadow" aria-hidden="true"></span>
            <div class="die-rig die-rig--one">
              <div class="die-cube" id="die-one" role="img" aria-label="첫 번째 주사위: 1"></div>
            </div>
            <div class="die-rig die-rig--two">
              <div class="die-cube" id="die-two" role="img" aria-label="두 번째 주사위: 1"></div>
            </div>
          </div>
          <div class="dice-result-stage" id="dice-result-stage" hidden></div>
          <button class="roll-button" id="roll-button" type="button"><span id="button-label">굴리기</span></button>
          <p class="hint" id="hint">1번 차례 · 슬롯이 멈춘 점의 개수가 결과예요</p>
        </section>
      </div>
    </main>
    <script src="./room.js?v=20261012-1"></script>
    <script src="./dice.js?v=20261012-2"></script>
  </body>
</html>
